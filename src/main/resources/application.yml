server:
  port: 8081

spring:
  application:
    name: gharsih-app
  
  # Database configuration - PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/graduation_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  
  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:your-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
            scope:
              - email
              - public_profile
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v18.0/dialog/oauth
            token-uri: https://graph.facebook.com/v18.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      
app:
  jwt:
    # Use a properly long secret key (at least 256 bits / 32 characters)
    secret: mySecretKeyThatShouldBeAtLeast256BitsLongForHMACAlgorithmToWorkProperly
    expiration-ms: 7776000000  # 90 days (90 * 24 * 60 * 60 * 1000)
    refresh-token:
      expiration-ms: 7776000000  # 90 days
    issuer: gharsih-app
  
  oauth2:
    # URL to redirect after successful OAuth2 login (Flutter app deep link)
    authorized-redirect-uri: gharsih://oauth2/callback
  
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type
    max-age: 3600

logging:
  level:
    com.example.Security: DEBUG
    org.hibernate: INFO

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
  show-actuator: false

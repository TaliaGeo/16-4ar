# ===== Production Configuration =====
# Activate with: --spring.profiles.active=prod
# All secrets MUST come from environment variables (no defaults)

server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate  # Never auto-modify schema in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}

management:
  endpoint:
    health:
      show-details: when-authorized

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 hours in production
    refresh-token:
      expiration-ms: 2592000000  # 30 days

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://gharsih.ps}

logging:
  level:
    group.g.graduation.backend: INFO
    org.hibernate: WARN
    root: WARN

weather:
  api:
    key: ${WEATHER_API_KEY}
